name: CI/CD Pipeline

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter and formatter check
        run: npm run lint

      - name: Run TypeScript & Svelte check
        run: npm run check

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Run unit tests
        run: npm run test

      - name: Build project
        run: npm run build

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_PRIVATE_KEY: ${{ secrets.VPS_PRIVATE_KEY }}
        run: |
          test -n "$VPS_HOST" || (echo "Missing secret: VPS_HOST" && exit 1)
          test -n "$VPS_USERNAME" || (echo "Missing secret: VPS_USERNAME" && exit 1)
          test -n "$VPS_PRIVATE_KEY" || (echo "Missing secret: VPS_PRIVATE_KEY" && exit 1)

      - name: Prepare SSH private key
        env:
          VPS_PRIVATE_KEY: ${{ secrets.VPS_PRIVATE_KEY }}
        run: |
          mkdir -p .ssh
          printf '%s' "$VPS_PRIVATE_KEY" | sed 's/\\n/\n/g' > .ssh/deploy_key
          chmod 600 .ssh/deploy_key

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key_path: .ssh/deploy_key
          passphrase: ${{ secrets.VPS_KEY_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            cd /home/ilham/app/desa-cipicung

            git pull origin main

            npm ci
            npm run build

            pm2 restart desa-cipicung
